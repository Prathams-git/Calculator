<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1 style="color: rgba(255, 255, 255, 0.615);">Calculator</h1>
    <div class="calculator">
    <div class="main">
            <div class="display">

            </div>
            <div class="buttons">
                <button class="nums">7</button>
                <button class="nums">8</button>
                <button class="nums">9</button>
                <button class="operator">+</button>
                <button class="nums">4</button>
                <button class="nums">5</button>
                <button class="nums">6</button>
                <button class="operator">-</button>
                <button class="nums">1</button>
                <button class="nums">2</button>
                <button class="nums">3</button>
                <button class="operator">x</button>
                <button id="clear" style="background-color: #ff6b6b;">C</button>
                <button class="nums">0</button>
                <button class="operator">.</button>
                <button class="operator">/</button>
                <button class="equal-btn">=</button>
                <button id="ac" style="background-color: #ff6b6b;">AC</button>
            </div>
        </div>
    </div>
    

    <script src="app.js"></script>
</body>
</html>
